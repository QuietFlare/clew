[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clew-nextflow"
version = "0.4.0"
description = "Clew provider for Nextflow: the .lineage store, work/ symlinks, Workflow Run RO-Crates, and the nf-core pipeline adapters"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "QuietFlare" }]
dependencies = ["clew-lineage>=0.4"]

[project.entry-points."clew.extractors"]
nextflow = "clew.provider.nextflow.extractor_lineage"
nextflow-work = "clew.provider.nextflow.extractor_work"
ro-crate = "clew.provider.nextflow.extractor_rocrate"

[project.entry-points."clew.adapters"]
sarek = "clew.provider.nextflow.adapter_sarek"
rnaseq = "clew.provider.nextflow.adapter_rnaseq"
viralrecon = "clew.provider.nextflow.adapter_viralrecon"

[tool.setuptools.packages.find]
# Installs into the clew.provider namespace; no __init__.py above the provider.
include = ["clew*"]
namespaces = true
