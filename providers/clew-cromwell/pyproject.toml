[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clew-cromwell"
version = "0.4.0"
description = "Clew provider for Cromwell workflow metadata, for WDL and Terra"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "QuietFlare" }]
dependencies = ["clew-lineage>=0.4"]

[project.entry-points."clew.extractors"]
cromwell = "clew.provider.cromwell.extractor_metadata"

[tool.setuptools.packages.find]
# Installs into the clew.provider namespace; no __init__.py above the provider.
include = ["clew*"]
namespaces = true
