[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clew-snakemake"
version = "0.4.0"
description = "Clew provider for Snakemake: the metadata store, and a path-matching adapter"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "QuietFlare" }]
dependencies = ["clew-lineage>=0.4"]

[project.entry-points."clew.extractors"]
snakemake = "clew.provider.snakemake.extractor_metadata"

[project.entry-points."clew.adapters"]
snakemake = "clew.provider.snakemake.adapter_paths"

[tool.setuptools.packages.find]
# Installs into the clew.provider namespace; no __init__.py above the provider.
include = ["clew*"]
namespaces = true
