[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clew-latch"
version = "0.4.0"
description = "Clew provider for Latch executions, from saved records or the API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "QuietFlare" }]
dependencies = ["clew-lineage>=0.4"]

[project.entry-points."clew.extractors"]
latch = "clew.provider.latch.extractor_execution"

[tool.setuptools.packages.find]
# Installs into the clew.provider namespace; no __init__.py above the provider.
include = ["clew*"]
namespaces = true
