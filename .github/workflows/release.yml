# Publish clew-lineage to PyPI when a version tag is pushed.
#
# Uses PyPI trusted publishing: PyPI trusts this repository's workflow
# identity directly, so no API token is stored in the repo or its secrets.
# The suite runs first, on the exact commit being shipped.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the suite on the tagged commit
        run: python3 -m unittest discover -s tests

      - name: Build sdist and wheel
        run: |
          python3 -m pip install build
          python3 -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
