# Build the Clew image from the Dockerfile at the root and publish it, so
# anyone with Docker runs the page with one command:
#
#   docker run -p 8770:8770 ghcr.io/quietflare/clew
#
# Every push to main gives ghcr.io/quietflare/clew:latest; a version tag
# gives ghcr.io/quietflare/clew:<tag> as well. The package must be public
# once, in its settings on github.com, for a pull without a token.

name: container

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: tags
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tags="ghcr.io/quietflare/clew:latest"
          if [ "$REF_TYPE" = "tag" ]; then
            tags="$tags,ghcr.io/quietflare/clew:$REF_NAME"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
