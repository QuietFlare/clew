[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clew-lineage"
version = "0.2.0"
description = "Works out what to delete, re-run, or disclose when something upstream of a pipeline goes bad. Reads the lineage your engine already records and returns a plan an auditor can verify."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "QuietFlare" }]
keywords = ["lineage", "provenance", "nextflow", "nf-core", "horus", "impact-analysis", "compliance", "change-control"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# The base install is stdlib-only on purpose: someone evaluating the
# argument should not have to install anything.
dependencies = []

[project.optional-dependencies]
# Only the event log needs a driver. Everything else stays stdlib.
log = ["psycopg[binary]>=3.1"]

[project.urls]
Homepage = "https://quietflare.net/clew"
Source = "https://github.com/QuietFlare/clew"
Issues = "https://github.com/QuietFlare/clew/issues"

[project.scripts]
clew = "clew.__main__:main"

[tool.setuptools.packages.find]
include = ["clew*"]

[tool.setuptools.package-data]
clew = ["data/*.json", "data/*.csv", "data/samplesheets/*.csv"]
