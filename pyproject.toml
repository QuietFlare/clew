[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clew-lineage"
version = "0.6.0"
description = "Lineage-based impact analysis and remediation for workflow runs: what a bad input, container or incident report reached, what to re-run, delete or disclose, sealed as evidence an auditor verifies offline. Incident triage with a typed classifier, MCP tools for agents, and agent-written providers under a conformance check."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "QuietFlare" }]
keywords = ["lineage", "provenance", "nextflow", "nf-core", "horus", "cromwell", "wdl", "snakemake", "impact-analysis", "compliance", "change-control", "audit-trail", "evidence", "policy-as-code", "incident-triage", "agentic-workflow", "ai-agents", "mcp", "mcp-server", "human-in-the-loop", "evals", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# The base install is stdlib-only on purpose: someone evaluating the
# argument should not have to install anything.
dependencies = []

[project.optional-dependencies]
# Only the event log needs a driver. Everything else stays stdlib.
log = ["psycopg[binary]>=3.1"]
# The agent that runs the steps: clew ui, clew build and clew/agent/agent.yaml need it.
agent = ["mainsheet>=0.1"]

[project.urls]
Homepage = "https://quietflare.net/clew"
Source = "https://github.com/QuietFlare/clew"
Issues = "https://github.com/QuietFlare/clew/issues"

[project.scripts]
clew = "clew.__main__:main"

# Built-in providers register the way a third party's would: importing the
# named module is what registers it. Another package declares the same groups.
[project.entry-points."clew.extractors"]
nextflow = "clew.provider.nextflow.extractor_lineage"
nextflow-work = "clew.provider.nextflow.extractor_work"
ro-crate = "clew.provider.nextflow.extractor_rocrate"
snakemake = "clew.provider.snakemake.extractor_metadata"
cromwell = "clew.provider.cromwell.extractor_metadata"
horus = "clew.provider.horus.extractor_lineage"
dnanexus = "clew.provider.dnanexus.extractor_describe"
latch = "clew.provider.latch.extractor_execution"

[project.entry-points."clew.adapters"]
sarek = "clew.provider.nextflow.adapter_sarek"
rnaseq = "clew.provider.nextflow.adapter_rnaseq"
viralrecon = "clew.provider.nextflow.adapter_viralrecon"
snakemake = "clew.provider.snakemake.adapter_paths"
vina-docking = "clew.provider.horus.adapter_vina_docking"


[tool.setuptools.packages.find]
# clew is a namespace: provider packages install into clew.provider.*
include = ["clew*"]
namespaces = true

[tool.setuptools.package-data]
clew = ["data/*.json", "data/*.csv", "data/samplesheets/*.csv"]
"clew.agent" = ["agent.yaml"]
